# Конфиг Skipa Watchdog. Скопируйте этот файл в config.yaml (обычно это делает install.sh)
# и при необходимости отредактируйте; проще всего - через меню: sudo skipa-watchdog.
#
# Блокировка идёт в ядре (iptables + ipset) без отдельного процесса: список сканеров обновляет
# таймер, а процесс notify-tail пишет обнаружения в detections.log и, если настроен Telegram
# или Matrix, отправляет уведомления. Все ключи ниже читаются bash-скриптами из service/.
# Файл содержит секреты (токены) - права 600 ставит установщик.

telegram:
  # Необязательно. Оставьте токен пустым, чтобы работать без Telegram (только локальные логи).
  # Токен - от @BotFather, chat_id - личный чат, группа или канал, где состоит бот.
  # Только отправка сообщений: команд в чате нет, управление - через меню на сервере.
  bot_token: ""
  chat_id: 0
  # Прокси для Telegram, если он недоступен напрямую (http://, https://, socks5://host:port)
  proxy: ""

matrix:
  # Необязательно. Можно включить вместе с Telegram или вместо него.
  # homeserver - https://matrix.example.org (http допускается только для localhost);
  # access_token - токен пользователя или бота; room_id - идентификатор вида !abc:example.org
  # (не алиас #комната). Пользователь должен уже состоять в комнате.
  homeserver: ""
  access_token: ""
  room_id: ""

notifications:
  # Уведомления копятся столько секунд и уходят одним сообщением (волна сканов не превращается
  # в поток алертов). 0 - отправлять каждое обнаружение сразу.
  batch_seconds: 30
  # Сколько адресов перечислять в одном сообщении (остальные - строкой "и ещё N")
  batch_max: 20
  # Язык текста сообщений: "ru" (по умолчанию) или "en"
  language: "ru"

sources:
  # Основной список: CIDR-блоки сканеров CyberOK/Skipa, ГРЧЦ, НКЦКИ
  # (репозиторий tread-lightly/CyberOK_Skipa_ips).
  primary_list_url: "https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_cidr.txt"
  # Дополнительный список (смешанный формат: CIDR / диапазоны / одиночные IP,
  # автоопределяется построчно). Оставьте пустой строкой, чтобы отключить.
  blacklist_url: "https://gist.githubusercontent.com/sngvy/07cee7ac810c9d222fbebddff8c1d1b8/raw/37cde2b27a560c647d0e8eb9d274e3409082d3e7/blacklist.txt"
  # Какой список реально использовать:
  #   "list1"  - только primary_list_url
  #   "list2"  - только blacklist_url
  #   "merged" - оба вместе, без повторов (по умолчанию)
  active_list: "merged"
  # Как часто обновлять списки (в днях)
  update_interval_days: 7
  # Самая широкая сеть из внешних списков (длина префикса): всё, что шире, отбрасывается как
  # подозрительное. Реальные списки сканеров - это /24 и одиночные адреса. Для Spamhaus DROP,
  # где встречаются сети до /16, поставьте 16. Источник, который целиком покрывает больше
  # ~4 млн адресов, игнорируется.
  min_prefix: 20
  # Списки IP блокируются автоматически, поэтому скачиваются только по https.
  # true разрешает обычный http (например, для списка во внутренней сети).
  allow_insecure_http: false
  # Минимум записей в источнике при ПЕРВОЙ загрузке (когда прошлой копии ещё нет): проверка
  # "список похудел вдвое" сравнивает с прошлой копией, а при первом запуске сравнивать не с чем,
  # и список из трёх строк (страница ошибки, пустой ответ прокси) был бы принят как настоящий.
  # Для действительно маленького списка поставьте меньше (у каждого источника из extra можно
  # задать свой min_entries).
  min_entries: 10

  # Дополнительные источники (кроме двух списков выше) - Spamhaus DROP, FireHOL, AbuseIPDB
  # blacklist или любой другой список IP/CIDR. Участвуют всегда, независимо от active_list,
  # пока enabled: true.
  #
  # type: "cidr_list" - простой текстовый список (CIDR или IP на строку,
  #                     комментарии после '#' или ';'): Spamhaus DROP, FireHOL и т.п.
  # type: "abuseipdb"  - JSON blacklist API AbuseIPDB (нужен свой api_key).
  extra:
    - name: "spamhaus_drop"
      display_name: "Spamhaus DROP"
      type: "cidr_list"
      url: "https://www.spamhaus.org/drop/drop.txt"
      enabled: false

    - name: "firehol_level1"
      display_name: "FireHOL Level 1"
      type: "cidr_list"
      url: "https://iplists.firehol.org/files/firehol_level1.netset"
      enabled: false

    - name: "abuseipdb"
      display_name: "AbuseIPDB Blacklist"
      type: "abuseipdb"
      # Бесплатный ключ: https://www.abuseipdb.com/register
      api_key: ""
      # Минимальный confidence score для включения IP (0-100)
      min_confidence: 90
      enabled: false

action:
  # Что делать при обнаружении скана:
  #   "notify"       - только уведомление (лог + Telegram/Matrix, если настроены), без блокировки
  #   "block"        - только блокировка в ядре (без записи в detections.log и уведомлений)
  #   "block_notify" - блокировка И уведомление (по умолчанию, рекомендуется)
  mode: "block_notify"

firewall:
  # Не рвать уже установленные TCP-сессии (по умолчанию false: блокировка действует на ВСЁ
  # от адреса из списка). true - блокируются новые TCP-соединения (SYN) и весь не-TCP трафик,
  # а TCP-сессии, уже открытые до блокировки, живут до своего закрытия.
  # ОСТОРОЖНО: сканер, успевший установить сессию, продолжит работать в её рамках.
  # После смены значения примените правила заново (меню -> Docker/Kubernetes).
  keep_established_tcp: false
  # Лимит LOG-правила (чтобы шторм сканов не забил журнал)
  log_limit: "30/second"
  log_burst: 40

monitoring:
  # Префикс записей LOG-правила в журнале ядра, по которому notify-tail находит обнаружения
  kernel_log_prefix: "CONN: "
  # Не слать повторное уведомление и не писать в detections.log один и тот же IP чаще,
  # чем раз в N минут
  alert_cooldown_minutes: 60
  # IP/подсети, которые никогда не блокируются (свои IP, мониторинг и т.п.). Частные сети
  # (10/8, 172.16/12, 192.168/16, 127/8) защищены всегда. ВАЖНО: впишите сюда IP, с которого
  # подключаетесь по SSH, если он статический. Проще всего - меню, пункт 7 (белый список).
  ignore_ips: []
  # Автоматически не блокировать IP, с которых сейчас открыты SSH-сессии на ssh_ports
  # (защита от отрезания себя от сервера)
  auto_allowlist: true
  ssh_ports: [22]

environment:
  # false - не подключать правила блокировки к DOCKER-USER / KUBE-* соответственно
  docker_scan: true
  k8s_scan: true

logging:
  # Куда пишутся skipa-watchdog.log и detections.log
  log_dir: "/var/log/skipa_watchdog"
