# Конфиг для лёгкого service-режима (watchdog_service.py, без Telegram).
# Скопируйте этот файл в service.yaml. В большинстве случаев значения по
# умолчанию (ниже) уже рабочие и менять ничего не обязательно.

sources:
  cidr_list_url: "https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_cidr.txt"
  range_list_url: "https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_range.txt"
  # Дополнительный смешанный список (CIDR/диапазоны/одиночные IP), можно
  # оставить пустой строкой, чтобы отключить.
  blacklist_url: "https://gist.githubusercontent.com/sngvy/07cee7ac810c9d222fbebddff8c1d1b8/raw/37cde2b27a560c647d0e8eb9d274e3409082d3e7/blacklist.txt"
  blacklist_name: "blacklist"
  update_interval_days: 7

monitoring:
  # "psutil" / "kernel_log" / "both" - см. README, раздел про nftables/iptables
  method: "psutil"
  kernel_log_prefix: "CONN: "
  kernel_log_command: []
  poll_interval_seconds: 5
  alert_cooldown_minutes: 60
  ignore_ips: []

enrichment:
  # В лёгком режиме по умолчанию выключено (никаких доп. сетевых запросов
  # на каждый обнаруженный скан). Включите, если нужны гео/ASN-данные и
  # в detections.log.
  enrich_in_service_mode: false
  ipinfo_token: ""
  ipregistry_key: ""

environment:
  # При старте один раз проверяется наличие Docker/Kubernetes и пишется
  # заметка в лог (см. также install.sh -> пункт про docker/k8s правила).
  docker_scan: true
  k8s_scan: true

logging:
  level: "INFO"
  # Куда пишутся skipa-watchdog-svc.log и detections.log
  service_log_dir: "/var/log/skipa_watchdog"
