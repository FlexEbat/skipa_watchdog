# Конфиг Skipa Watchdog. Скопируйте этот файл в config.yaml (обычно это
# делает install.sh) и при необходимости отредактируйте.
#
# Skipa Watchdog - ОДИН процесс (watchdog.py): он всегда мониторит соединения,
# логирует в /var/log/skipa_watchdog/ и (в зависимости от action.mode ниже)
# блокирует сканеров через iptables. Telegram - НЕ отдельный режим, а
# необязательная надстройка: заполните telegram.bot_token/chat_id, если
# хотите ещё и получать уведомления и пользоваться командами в чате. Если
# оставить bot_token пустым - всё остальное работает точно так же, просто
# без Telegram.

telegram:
  # Оставьте пустым, чтобы работать без Telegram (только локальный лог/блокировка)
  bot_token: ""
  chat_id: 0
  # Telegram user id администраторов (кому разрешены команды /block, /unblock,
  # /update и т.д.). Если список пуст, команды принимаются только из чата
  # chat_id. Рекомендуется указать свой user id.
  admin_ids: []
  # Прокси для Telegram, если он недоступен напрямую (http://, https://, socks5://).
  # Для socks5 нужен extra: pip install "python-telegram-bot[socks]"
  proxy: ""

sources:
  # Основной список: CIDR-блоки сканеров CyberOK/Skipa, ГРЧЦ, НКЦКИ
  # (репозиторий tread-lightly/CyberOK_Skipa_ips). Раньше дополнительно
  # подключался ещё и skipa_range.txt - тот же набор IP в другой нотации,
  # от него отказались как от чистого дублирования.
  primary_list_url: "https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_cidr.txt"
  # Дополнительный список (смешанный формат: CIDR / диапазоны / одиночные IP,
  # автоопределяется построчно). Оставьте пустой строкой, чтобы отключить.
  blacklist_url: "https://gist.githubusercontent.com/sngvy/07cee7ac810c9d222fbebddff8c1d1b8/raw/37cde2b27a560c647d0e8eb9d274e3409082d3e7/blacklist.txt"
  # Как этот источник будет подписан в алертах и /status
  blacklist_name: "blacklist"
  # Какой список реально использовать:
  #   "list1"  - только primary_list_url
  #   "list2"  - только blacklist_url
  #   "merged" - оба вместе, без повторов (по умолчанию)
  active_list: "merged"
  # Как часто обновлять базу IP (в днях)
  update_interval_days: 7
  # Самая широкая сеть из внешних списков (длина префикса): всё, что шире,
  # отбрасывается как подозрительное. Реальные списки сканеров - это /24 и одиночные
  # адреса. Для Spamhaus DROP, где встречаются сети до /16, поставьте 16.
  # Источник, который целиком покрывает больше ~4 млн адресов, игнорируется.
  min_prefix: 20
  # Списки IP блокируются автоматически, поэтому скачиваются только по https.
  # true разрешает обычный http (например, для списка во внутренней сети).
  allow_insecure_http: false

  # Дополнительные источники (кроме двух списков выше) - Spamhaus DROP, FireHOL,
  # AbuseIPDB blacklist или любой другой список IP/CIDR. Каждый показывается в
  # алерте отдельно ("База: Spamhaus DROP"), матчится тем же движком и (при
  # блокировке) попадает в ipset вместе с остальной базой. Участвуют всегда,
  # независимо от active_list, пока enabled: true.
  #
  # type: "cidr_list" - простой текстовый список (CIDR или IP на строку,
  #                     комментарии после '#' или ';'): Spamhaus DROP, FireHOL и т.п.
  # type: "abuseipdb"  - JSON blacklist API AbuseIPDB (нужен свой api_key).
  extra:
    - name: "spamhaus_drop"
      display_name: "Spamhaus DROP"
      type: "cidr_list"
      url: "https://www.spamhaus.org/drop/drop.txt"
      enabled: false

    - name: "firehol_level1"
      display_name: "FireHOL Level 1"
      type: "cidr_list"
      url: "https://iplists.firehol.org/files/firehol_level1.netset"
      enabled: false

    - name: "abuseipdb"
      display_name: "AbuseIPDB Blacklist"
      type: "abuseipdb"
      # Бесплатный ключ: https://www.abuseipdb.com/register
      api_key: ""
      # Минимальный confidence score для включения IP в базу (0-100)
      min_confidence: 90
      enabled: false

action:
  # Что делать при обнаружении скана:
  #   "notify"       - только уведомление (лог + Telegram, если настроен)
  #   "block"        - только блокировка через iptables (без уведомлений)
  #   "block_notify" - блокировка И уведомление (по умолчанию, рекомендуется)
  #
  # Блокировка работает через отдельную цепочку iptables SKIPA-BLOCK,
  # подключённую и к хосту (INPUT), и к Docker (DOCKER-USER), и к
  # Kubernetes (KUBE-*). Переходы в эту цепочку watchdog.py ставит и сам
  # проверяет/чинит каждую минуту (после перезагрузки, рестарта Docker,
  # ufw/firewalld reload) - вручную запускать install-firewall-rules.sh не нужно.
  mode: "block_notify"
  # На сколько часов блокировать автоматически (0 = бессрочно). Ручные
  # блокировки (/block) по умолчанию бессрочные.
  block_timeout_hours: 72
  # Если установлен ipset: загружать ВСЮ базу сканеров в ядро заранее, чтобы
  # сканер отсекался уже на первом SYN, а не после него. LOG пишется только для
  # SYN от сканеров (общий LOG всех SYN не нужен).
  preload_db: true

monitoring:
  # "poll" (периодический опрос /proc/net/tcp, без доп. зависимостей) /
  # "kernel_log" (чтение "CONN: " из dmesg/journalctl -k) / "both" (оба сразу,
  # рекомендуется и стоит по умолчанию - "kernel_log" ловит даже одиночный
  # SYN, который сразу же оборвался, "poll" подстраховывает, если LOG-правило
  # почему-то не встало). Работает из коробки: install.sh всегда ставит
  # LOG-правило при установке (см. install-firewall-rules.sh).
  method: "both"
  kernel_log_prefix: "CONN: "
  kernel_log_command: []
  poll_interval_seconds: 5
  # Не слать повторный алерт с одного и того же IP чаще, чем раз в N минут
  alert_cooldown_minutes: 60
  # IP/подсети, которые никогда не считаются сканом и не блокируются (свои IP,
  # мониторинг и т.п.). Частные сети (10/8, 172.16/12, 192.168/16, 127/8) и
  # сети короче /16 защищены всегда. ВАЖНО: впишите сюда IP, с которого
  # подключаетесь по SSH, если он статический.
  ignore_ips: []
  # Автоматически не блокировать IP, с которых сейчас открыты SSH-сессии на
  # ssh_ports (защита от отрезания себя от сервера)
  auto_allowlist: true
  # Метод poll дополнительно читает таблицу conntrack ядра (/proc/net/nf_conntrack):
  # так он видит и трафик на опубликованные порты Docker-контейнеров (в
  # /proc/net/tcp хоста его нет), и короткие сканы, успевшие закрыться между
  # опросами. Нужен root и загруженный nf_conntrack (при Docker он есть всегда).
  use_conntrack: true
  ssh_ports: [22]
  # Как часто проверять и чинить правила iptables/ipset (сек.)
  guard_interval_seconds: 60

enrichment:
  # Обогащать алерт гео/ASN-данными (ipinfo.io + RIPEstat + ipregistry.co).
  # Каждое обогащение - лишний сетевой запрос, при большом потоке сканов
  # можно выключить.
  enabled: true
  ipinfo_token: ""
  ipregistry_key: ""

environment:
  # При старте процесс один раз проверяет наличие Docker/Kubernetes и пишет
  # заметку в лог (плюс доступно по команде /env в Telegram, если он
  # подключён). docker_scan/k8s_scan: false - не подключать SKIPA-BLOCK к
  # DOCKER-USER / KUBE-* соответственно. Важно: опубликованные порты контейнеров
  # не видны в /proc/net/tcp хоста - их видит conntrack (monitoring.use_conntrack)
  # и kernel_log/ipset.
  docker_scan: true
  k8s_scan: true

firewall:
  # Лимит LOG-правила (чтобы шторм сканов не забил журнал)
  log_limit: "30/second"
  log_burst: 40

logging:
  level: "INFO"
  # Куда пишутся skipa-watchdog.log и detections.log
  log_dir: "/var/log/skipa_watchdog"

alerting:
  # Как часто повторять попытку отправки алертов, которые не ушли в
  # Telegram из-за временной недоступности связи (сек.)
  retry_interval_seconds: 300

banning:
  # Бан вручную и автоматически поверх общего механизма блокировки (цепочка
  # SKIPA-BLOCK + ipset, см. раздел action). Включает кнопку "🚫 Забанить" под
  # каждым алертом в Telegram и команды /banlist, /unban. Отдельно настраивать
  # ipset или правила не нужно - watchdog создаёт и чинит их сам.
  enabled: false
  # Автоматически банить КАЖДЫЙ обнаруженный IP, без нажатия кнопки (работает и
  # при action.mode: notify). РИСК: ложные срабатывания (например, легитимный
  # сканер безопасности вроде Shodan/Censys, который вы сами используете)
  # забанятся тоже. Если не уверены - оставьте false и банте кнопкой.
  auto_ban_new_hits: false
  # Длительность автобана в минутах, 0 = навсегда
  auto_ban_duration_minutes: 60
  # Длительность бана по кнопке "Забанить" в минутах, 0 = навсегда
  manual_ban_duration_minutes: 1440
  # Если указать имя существующего jail в fail2ban (например "sshd" или свой
  # кастомный, см. fail2ban/ в этом репозитории) - бот ДОПОЛНИТЕЛЬНО
  # зарегистрирует бан там же (`fail2ban-client set <jail> banip <ip>`), чтобы
  # он был виден в `fail2ban-client status`. Необязательно.
  fail2ban_jail: ""

healthcheck:
  # "Watchdog для watchdog'а": следит, что сами циклы мониторинга (опрос
  # соединений, чтение kernel-лога, проверка правил firewall) не зависли молча.
  # Если монитор не подавал признаков жизни дольше stale_after_minutes - в лог и
  # в Telegram придёт предупреждение, а при восстановлении - сообщение об этом.
  enabled: true
  stale_after_minutes: 15
  check_interval_minutes: 5

dashboard:
  # Простой веб-дашборд (без внешних зависимостей) со статусом базы, последними
  # событиями, списком блокировок и состоянием мониторов. По умолчанию слушает
  # только localhost - откройте через SSH-туннель (ssh -L 8080:localhost:8080 ...)
  # либо смените host на 0.0.0.0 и ОБЯЗАТЕЛЬНО задайте username/password ниже
  # (лучше - за reverse-proxy с TLS).
  enabled: false
  host: "127.0.0.1"
  port: 8080
  # Если оба поля не пустые - дашборд спрашивает HTTP Basic Auth
  username: ""
  password: ""

digest:
  # Автоматический еженедельный дайджест (статистика + график) в Telegram, не
  # дожидаясь команды /stats. График рисует matplotlib (необязательная
  # зависимость: pip install -r requirements-extras.txt), без него приходит
  # текстовая гистограмма по часам.
  enabled: true
  # День недели: 0=понедельник, 1=вторник, ..., 6=воскресенье
  weekday: 0
  # Время отправки (по времени сервера)
  hour: 9
  minute: 0
