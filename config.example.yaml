# Конфиг Skipa Watchdog. Скопируйте этот файл в config.yaml (обычно это
# делает install.sh) и при необходимости отредактируйте.
#
# Skipa Watchdog - ОДИН процесс (watchdog.py): он всегда мониторит соединения,
# логирует в /var/log/skipa_watchdog/ и (в зависимости от action.mode ниже)
# блокирует сканеров через iptables. Telegram - НЕ отдельный режим, а
# необязательная надстройка: заполните telegram.bot_token/chat_id, если
# хотите ещё и получать уведомления и пользоваться командами в чате. Если
# оставить bot_token пустым - всё остальное работает точно так же, просто
# без Telegram.

telegram:
  # Оставьте пустым, чтобы работать без Telegram (только локальный лог/блокировка)
  bot_token: ""
  chat_id: 0
  # Telegram user id администраторов (кому разрешены команды /block, /unblock,
  # /update и т.д.). Если список пуст, команды принимаются только из чата
  # chat_id. Рекомендуется указать свой user id.
  admin_ids: []
  # Прокси для Telegram, если он недоступен напрямую (http://, https://, socks5://).
  # Для socks5 нужен extra: pip install "python-telegram-bot[socks]"
  proxy: ""

sources:
  # Основной список: CIDR-блоки сканеров CyberOK/Skipa, ГРЧЦ, НКЦКИ
  # (репозиторий tread-lightly/CyberOK_Skipa_ips). Раньше дополнительно
  # подключался ещё и skipa_range.txt - тот же набор IP в другой нотации,
  # от него отказались как от чистого дублирования.
  primary_list_url: "https://raw.githubusercontent.com/tread-lightly/CyberOK_Skipa_ips/main/lists/skipa_cidr.txt"
  # Дополнительный список (смешанный формат: CIDR / диапазоны / одиночные IP,
  # автоопределяется построчно). Оставьте пустой строкой, чтобы отключить.
  blacklist_url: "https://gist.githubusercontent.com/sngvy/07cee7ac810c9d222fbebddff8c1d1b8/raw/37cde2b27a560c647d0e8eb9d274e3409082d3e7/blacklist.txt"
  # Как этот источник будет подписан в алертах и /status
  blacklist_name: "blacklist"
  # Какой список реально использовать:
  #   "list1"  - только primary_list_url
  #   "list2"  - только blacklist_url
  #   "merged" - оба вместе, без повторов (по умолчанию)
  active_list: "merged"
  # Как часто обновлять базу IP (в днях)
  update_interval_days: 7

action:
  # Что делать при обнаружении скана:
  #   "notify"       - только уведомление (лог + Telegram, если настроен)
  #   "block"        - только блокировка через iptables (без уведомлений)
  #   "block_notify" - блокировка И уведомление (по умолчанию, рекомендуется)
  #
  # Блокировка работает через отдельную цепочку iptables SKIPA-BLOCK,
  # подключённую и к хосту (INPUT), и к Docker (DOCKER-USER), и к
  # Kubernetes (KUBE-*). Переходы в эту цепочку watchdog.py ставит и сам
  # проверяет/чинит каждую минуту (после перезагрузки, рестарта Docker,
  # ufw/firewalld reload) - вручную запускать install-firewall-rules.sh не нужно.
  mode: "block_notify"
  # На сколько часов блокировать автоматически (0 = бессрочно). Ручные
  # блокировки (/block) по умолчанию бессрочные.
  block_timeout_hours: 72
  # Если установлен ipset: загружать ВСЮ базу сканеров в ядро заранее, чтобы
  # сканер отсекался уже на первом SYN, а не после него. LOG пишется только для
  # SYN от сканеров (общий LOG всех SYN не нужен).
  preload_db: true

monitoring:
  # "poll" (периодический опрос /proc/net/tcp, без доп. зависимостей) /
  # "kernel_log" (чтение "CONN: " из dmesg/journalctl -k) / "both" (оба сразу,
  # рекомендуется и стоит по умолчанию - "kernel_log" ловит даже одиночный
  # SYN, который сразу же оборвался, "poll" подстраховывает, если LOG-правило
  # почему-то не встало). Работает из коробки: install.sh всегда ставит
  # LOG-правило при установке (см. install-firewall-rules.sh).
  method: "both"
  kernel_log_prefix: "CONN: "
  kernel_log_command: []
  poll_interval_seconds: 5
  # Не слать повторный алерт с одного и того же IP чаще, чем раз в N минут
  alert_cooldown_minutes: 60
  # IP/подсети, которые никогда не считаются сканом и не блокируются (свои IP,
  # мониторинг и т.п.). Частные сети (10/8, 172.16/12, 192.168/16, 127/8) и
  # сети короче /16 защищены всегда. ВАЖНО: впишите сюда IP, с которого
  # подключаетесь по SSH, если он статический.
  ignore_ips: []
  # Автоматически не блокировать IP, с которых сейчас открыты SSH-сессии на
  # ssh_ports (защита от отрезания себя от сервера)
  auto_allowlist: true
  ssh_ports: [22]
  # Как часто проверять и чинить правила iptables/ipset (сек.)
  guard_interval_seconds: 60

enrichment:
  # Обогащать алерт гео/ASN-данными (ipinfo.io + RIPEstat + ipregistry.co).
  # Каждое обогащение - лишний сетевой запрос, при большом потоке сканов
  # можно выключить.
  enabled: true
  ipinfo_token: ""
  ipregistry_key: ""

environment:
  # При старте процесс один раз проверяет наличие Docker/Kubernetes и пишет
  # заметку в лог (плюс доступно по команде /env в Telegram, если он
  # подключён). docker_scan/k8s_scan: false - не подключать SKIPA-BLOCK к
  # DOCKER-USER / KUBE-* соответственно. Важно: опубликованные порты контейнеров
  # не видны в /proc/net/tcp хоста, для них работает только kernel_log/ipset.
  docker_scan: true
  k8s_scan: true

firewall:
  # Лимит LOG-правила (чтобы шторм сканов не забил журнал)
  log_limit: "30/second"
  log_burst: 40

logging:
  level: "INFO"
  # Куда пишутся skipa-watchdog.log и detections.log
  log_dir: "/var/log/skipa_watchdog"

alerting:
  # Как часто повторять попытку отправки алертов, которые не ушли в
  # Telegram из-за временной недоступности связи (сек.)
  retry_interval_seconds: 300
