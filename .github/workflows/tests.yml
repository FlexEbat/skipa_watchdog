name: tests

on:
  push:
    branches: [main]
  pull_request:

# Сам проект - чистый bash. Python нужен только тестам (они запускают bash-скрипты с поддельными
# curl/ipset/iptables) и, для проверки config.yaml, PyYAML.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML (только для тестов)
        run: python -m pip install pyyaml
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in install.sh service/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning install.sh service/*.sh
